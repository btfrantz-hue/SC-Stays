name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Build and deploy to Vercel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm install -g npm@11.13.0

      - run: npm ci

      # The nitro `vercel` preset writes .vercel/output (Build Output API v3),
      # which is exactly what `vercel deploy --prebuilt` uploads — so the build
      # runs here, not on Vercel's builders. VITE_* are build-time only: Vite
      # inlines them into the bundle, so they come from GitHub Secrets.
      # Runtime vars (SUPABASE_SERVICE_ROLE_KEY, ADMIN_*) are NOT set here —
      # they live in the Vercel project's environment variables.
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GA_ID: ${{ secrets.VITE_GA_ID }}

      # ORG/PROJECT ids are plain env, not secrets: they are project
      # identifiers (useless without the token) and .vercel/ is gitignored,
      # so the CLI cannot read them from the checkout.
      - name: Deploy to Vercel
        run: npx vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_Ws2LQbQplAcIxtcLUC1v4Ewj
          VERCEL_PROJECT_ID: prj_Sx8L5VmlgEJzm9mY95G3vZadzCEK
